name: Build Flutter Apps

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Find version in commit message
        id: detect
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="$(printf '%s' "$COMMIT_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?' | head -n 1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            build-command: flutter build apk --release
            artifact-path: build/app/outputs/flutter-apk/app-release.apk
          - platform: ios
            os: macos-latest
            build-command: flutter build ios --release --no-codesign
            artifact-path: ios-release.zip
          - platform: macos
            os: macos-latest
            build-command: flutter build macos --release
            artifact-path: macos-release.zip
          - platform: windows
            os: windows-latest
            build-command: flutter build windows --release
            artifact-path: windows-release.zip
          - platform: web
            os: ubuntu-latest
            build-command: flutter build web --release
            artifact-path: web-release.zip
          - platform: linux
            os: ubuntu-latest
            build-command: flutter build linux --release
            artifact-path: linux-release.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop target
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build release
        run: ${{ matrix.build-command }}

      - name: Package iOS app
        if: matrix.platform == 'ios'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ios-release.zip

      - name: Package macOS app
        if: matrix.platform == 'macos'
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" macos-release.zip

      - name: Package Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'windows-release.zip' -Force

      - name: Package web app
        if: matrix.platform == 'web'
        run: cd build/web && zip -r "$GITHUB_WORKSPACE/web-release.zip" .

      - name: Package Linux app
        if: matrix.platform == 'linux'
        run: tar -czf linux-release.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes --target "$GITHUB_SHA"
